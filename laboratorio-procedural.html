<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Anima Soul — Laboratório procedural</title><script src="simulation-v1.js" defer></script><script src="narration.js" defer></script><style>
:root{color-scheme:dark;background:#080f1c;color:#dce6f3;font:16px Georgia,serif}*{box-sizing:border-box}body{margin:0}main{max-width:480px;height:100vh;height:100dvh;overflow:hidden;margin:auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#1a3048,#091423 55%);position:relative}header{padding:8px 12px;text-align:center}h1{font-size:20px;letter-spacing:4px;font-weight:400;margin:0}h2{font-size:22px;font-weight:400;margin:4px 0}small{font:11px system-ui;color:#a9bdd5}#art{flex:0 0 clamp(60px,16dvh,130px);background-size:cover;background-position:center;position:relative}#screen{min-height:0;flex:1;display:flex;flex-direction:column;padding:8px 13px}#prose{overflow-y:auto;min-height:0;flex:1;white-space:pre-line;line-height:1.5;overscroll-behavior:contain}#actions{flex:none;max-height:47dvh;overflow:auto;padding:0 12px 5px}button,select{font:inherit;color:inherit;background:#14253b;border:1px solid #526984;border-radius:4px;padding:7px 9px;min-height:40px;width:100%;text-align:left}button:disabled{opacity:.45}#actions button{margin:2px 0;font-size:14px}#pray{position:absolute;right:12px;top:calc(38px + clamp(60px,16dvh,130px) - 42px);width:36px;height:36px;min-height:36px;border-radius:50%;padding:0;text-align:center;font-size:21px}#nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #4a6079;padding:5px 3px max(5px,env(safe-area-inset-bottom))}#nav button{border:0;background:transparent;text-align:center;font:11px system-ui;min-height:44px;padding:2px}#nav b{display:block;font:20px Georgia}#notice{font:11px system-ui;color:#dfc8a8;margin:0 12px}#finish{font-size:12px;min-height:28px;border:0;background:none;text-align:right}dialog{width:min(94vw,440px);max-height:85dvh;background:#101e30;color:inherit;border:1px solid #8198b4;border-radius:8px}dialog button{margin:4px 0}dialog p{line-height:1.5}button:focus-visible{outline:2px solid #d0e4ff}[hidden]{display:none!important}
</style></head><body><main><header><h1>✧ ANIMA SOUL</h1><small>Laboratório procedural · versão experimental</small></header><div id="art"></div><section id="screen"><small id="meta"></small><h2 id="title"></h2><div id="prose"></div><button id="finish" hidden>Mostrar texto completo</button></section><section id="actions"></section><p id="notice" role="status"></p><button id="pray" hidden aria-label="Orar">✧</button><nav id="nav"><button data-panel="actions"><b>◇</b>Ações</button><button data-panel="profile"><b>♙</b>Perfil</button><button data-panel="relations"><b>♧</b>Relações</button><button data-panel="inventory"><b>▣</b>Inventário</button><button data-panel="chronicles"><b>▤</b>Crônicas</button></nav></main><dialog id="panel"><h2 id="panel-title"></h2><div id="panel-content"></div><button id="close">Retomar a narrativa</button></dialog><script>
document.addEventListener('DOMContentLoaded',()=>{
const A=AnimaSimulationV1,N=AnimaNarration.create(),key='anima-procedural-lab-v1',$=id=>document.getElementById(id);let s,speed='normal',lastKey='',outcome='';
const fresh=()=>A.make(crypto.getRandomValues(new Uint32Array(1))[0]);try{s=A.load(localStorage.getItem(key));speed=localStorage.getItem(key+'-speed')||'normal';outcome=localStorage.getItem(key+'-outcome')||'';}catch{s=fresh();}
const node=(tag,text)=>{let n=document.createElement(tag);n.textContent=text;return n};const button=(parent,label,fn)=>{let b=node('button',label);b.onclick=fn;parent.append(b);return b;};
function save(){try{localStorage.setItem(key,A.save(s));localStorage.setItem(key+'-outcome',outcome);localStorage.setItem(key+'-speed',speed);$('notice').textContent='';}catch{$('notice').textContent='Não foi possível salvar neste navegador.';}}
function execute(op){if(N.active)return;const r=A.apply(s,{id:s.seed+':'+s.revision+':'+op.id,revision:s.revision,token:op.token});if(r.status==='accepted'){outcome=r.outcome||'';s=r.state;save();$('panel').close();render();}else $('notice').textContent=r.reason;}
function render(){N.stop();const v=A.view(s),clock=String(Math.floor(v.minute/60)).padStart(2,'0')+':'+String(v.minute%60).padStart(2,'0'),k=s.seed+':'+s.revision;
$('meta').textContent=v.age+' anos · '+v.location+' · '+clock;$('title').textContent=v.alive?v.place:'Existência encerrada';$('art').style.backgroundImage='linear-gradient(0deg,#091423,transparent 80%),url(art/'+v.era+'.webp)';$('actions').replaceChildren();
const text=[outcome,v.text].filter((x,i,a)=>x&&a.indexOf(x)===i).join('\n\n');const opts=v.options.filter(x=>!x.floating).slice(0,5);for(const op of opts)button($('actions'),op.label,()=>execute(op));const prayer=v.options.find(x=>x.floating);$('pray').hidden=!prayer;$('pray').onclick=prayer?()=>execute(prayer):null;
if(lastKey===k){$('prose').textContent=text;$('actions').hidden=false;$('finish').hidden=true;return;}lastKey=k;$('actions').hidden=true;$('finish').hidden=false;$('prose').scrollTop=0;
N.play({key:k,text,speed,onText:t=>{$('prose').textContent=t;$('prose').scrollTop=$('prose').scrollHeight;},onDone:()=>{$('actions').hidden=false;$('finish').hidden=true;}});
}
$('finish').onclick=()=>N.finish();$('close').onclick=()=>$('panel').close();
function panel(which){const v=A.view(s),p=$('panel-content');p.replaceChildren();$('panel-title').textContent=({actions:'Ações',profile:'Perfil',relations:'Relações',inventory:'Inventário',chronicles:'Crônicas'})[which];
const line=t=>p.append(node('p',t));
if(which==='actions'){if(N.active)line('Aguarde o narrador terminar.');else {for(const op of v.options.filter(x=>!x.floating))button(p,op.label,()=>execute(op));if(v.canCondense){for(const d of [7,30,365])button(p,'Acompanhar até '+d+' dias de rotina',()=>{const r=A.condense(s,d,s.revision);if(r.status==='accepted'){s=r.state;outcome='';save();$('panel').close();render();}});}}}
if(which==='profile'){line(v.age+' anos · '+v.stage);line('Saúde: '+s.player.health);Object.entries(s.player.knowledge).forEach(([k,n])=>line(k+' · experiências: '+n));line('Ritmo da narração');for(const [k,label] of [['slow','Calmo'],['normal','Natural'],['fast','Rápido'],['instant','Texto completo']])button(p,label,()=>{speed=k;save();$('panel').close();lastKey='';render();});}
if(which==='relations')s.people.filter(x=>x.alive).forEach(x=>line(x.name+' · '+x.role+' · '+(x.occupation||'sem ofício')));
if(which==='inventory'){line('Recursos disponíveis: '+s.player.money+' moedas.');line('Inventário de objetos ainda não implementado neste motor.');}
if(which==='chronicles')v.journal.slice(-100).reverse().forEach(f=>line('Dia '+f.day+' · '+f.text));
if(!$('panel').open)$('panel').showModal();}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>panel(b.dataset.panel));save();render();
});
</script></body></html>
